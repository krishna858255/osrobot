  <style>
    .material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }
    @keyframes kl-idle-breath { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-5px) scale(1.015); } }
    @keyframes kl-blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.06); } }
    .kl-face-breath { animation: kl-idle-breath 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .kl-eye-blink { animation: kl-blink 4.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) { .kl-face-breath, .kl-eye-blink { animation: none !important; } }

<body class="bg-dark-surface-container-lowest text-dark-on-surface font-body antialiased">
  <!-- Immersive Full-Screen Landscape Presentation (No Nav, No Dashboard Panels) -->

    <!-- Unobtrusive Top-Right Exit Control -->
    <div class="absolute top-6 right-6 flex items-center gap-3">
      <button type="button" aria-label="Exit full-screen robot face" class="inline-flex items-center gap-2 min-h-11 px-4 rounded-full bg-dark-surface-container/80 text-dark-on-surface-variant border border-dark-outline-variant/50 hover:text-dark-on-surface hover:bg-dark-surface-container-high transition-colors duration-state-change">

        <span data-design-text-token="label-md" class="font-label text-label-md">Exit full-screen</span>
      </button>
    </div>

    <!-- Expressive Robot Face Only -->

        <rect x="152" y="112" width="88" height="96" rx="38" fill="#ADC6FF"></rect>
        <circle cx="196" cy="160" r="20" fill="#0B0E15"></circle>
        <circle cx="210" cy="144" r="7" fill="#FFFFFF" opacity="0.88"></circle>
      </g>

      <!-- Right Eye -->

        <rect x="420" y="92" width="128" height="136" rx="52" fill="#191B23" stroke="#272A31" stroke-width="2"></rect>
        <rect x="440" y="112" width="88" height="96" rx="38" fill="#ADC6FF"></rect>
        <circle cx="484" cy="160" r="20" fill="#0B0E15"></circle>
        <circle cx="498" cy="144" r="7" fill="#FFFFFF" opacity="0.88"></circle>
      </g>

      <!-- Calm Responsive Mouth -->
      <path d="M 276 286 Q 340 306 404 286" stroke="#C2C6D6" stroke-width="6" stroke-linecap="round" fill="none"></path>
    </svg>

    <!-- Subtle Bottom-Center Whisper Hint -->
