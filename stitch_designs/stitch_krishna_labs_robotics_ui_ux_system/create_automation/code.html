  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-dark-surface text-dark-on-surface font-body antialiased">
  <div class="min-h-[1024px] w-full flex flex-col bg-dark-surface" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <!-- Task Flow Header (Back button, no root tabs) -->
    <header class="h-14 px-6 border-b border-dark-outline-variant/50 bg-dark-surface-container-lowest/60 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <button type="button" aria-label="Back to Automation Centre" class="inline-flex items-center justify-center w-10 h-10 rounded-md bg-dark-surface-container text-dark-on-surface border border-dark-outline-variant/60 hover:bg-dark-surface-container-high">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
        </button>
        <h1 data-design-text-token="headline-sm" class="font-headline text-headline-sm text-dark-on-surface">Create Automation</h1>
      </div>
      <div class="flex items-center gap-3">
        <button type="button" class="min-h-10 px-4 rounded-md bg-dark-surface-container-high text-dark-on-surface border border-dark-outline-variant/60 font-label text-label-md">Cancel</button>
        <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="min-h-10 px-5 rounded-md bg-dark-primary text-dark-on-primary font-label text-label-md">Save automation</button>
      </div>
    </header>

    <main class="flex-1 p-6 max-w-3xl w-full mx-auto flex flex-col gap-6">
      <section class="bg-dark-surface-container rounded-lg border border-dark-outline-variant/60 p-6 flex flex-col gap-5">
        <div class="flex flex-col gap-2">
          <label data-design-text-token="label-md" class="font-label text-label-md text-dark-on-surface">Automation name</label>
          <input type="text" value="Morning Workbench Briefing" class="min-h-11 px-4 rounded-md bg-dark-surface-container-lowest border border-dark-outline-variant/70 text-dark-on-surface font-body text-body-md">
        </div>

        <div class="flex flex-col gap-2">
          <label data-design-text-token="label-md" class="font-label text-label-md text-dark-on-surface">Trigger</label>
          <select class="min-h-11 px-4 rounded-md bg-dark-surface-container-lowest border border-dark-outline-variant/70 text-dark-on-surface font-body text-body-md">
            <option>Scheduled time (08:30 AM, Weekdays)</option>
            <option>On tablet wake / startup</option>
            <option>When camera detects activity</option>
            <option>Voice wake phrase</option>
          </select>
        </div>

        <div class="flex flex-col gap-2">
          <label data-design-text-token="label-md" class="font-label text-label-md text-dark-on-surface">Robot face expression</label>
          <select class="min-h-11 px-4 rounded-md bg-dark-surface-container-lowest border border-dark-outline-variant/70 text-dark-on-surface font-body text-body-md">
            <option>Happy</option>
            <option>Neutral</option>
            <option>Curious</option>
            <option>Speaking</option>
          </select>
        </div>

        <div class="flex flex-col gap-2">
          <label data-design-text-token="label-md" class="font-label text-label-md text-dark-on-surface">Assistant action</label>
          <textarea rows="3" class="p-4 rounded-md bg-dark-surface-container-lowest border border-dark-outline-variant/70 text-dark-on-surface font-body text-body-md">Greet Krishna, verify Gemini Live connection latency, and summarize any pending reminders.</textarea>
        </div>

        <label class="flex items-center justify-between gap-4 min-h-14 px-4 py-3 rounded-md bg-dark-surface-container-low border border-dark-outline-variant/60 cursor-pointer">
          <div>
            <span data-design-text-token="body-md" class="block font-body text-body-md text-dark-on-surface">Enable immediately after saving</span>
            <span data-design-text-token="body-sm" class="font-body text-body-sm text-dark-on-surface-variant">You can pause or edit this routine anytime from Automation Centre.</span>
          </div>
          <button type="button" role="switch" aria-checked="true" class="relative inline-flex items-center shrink-0 w-12 h-7 rounded-full bg-dark-primary"><span class="inline-block w-5 h-5 translate-x-6 rounded-full bg-dark-on-primary"></span></button>
        </label>
      </section>
    </main>
  </div>


</body></html>
